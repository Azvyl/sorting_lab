<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terminal Algoritma Sorting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/shell.css">
</head>

<body>
  <header class="shell-top">
    <div class="title">
      <h1><span style="color:var(--accent)">⬢</span> MATERI SORTING & STUDI KASUS SORTING</h1>
      <p>SATU TEMA, DUA RUANG BELAJAR ALGORITMA PENGURUTAN</p>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="active" data-target="pane-lab" role="tab" aria-selected="true">
        <span class="dot"></span><span class="label-long">01 &middot; </span>MATERI SORTING
      </button>
      <button type="button" data-target="pane-sik" role="tab" aria-selected="false">
        <span class="dot"></span><span class="label-long">02 &middot; </span>STUDI KASUS SORTING
      </button>
    </div>
    <button class="theme-btn" id="shellTheme" title="Ganti tema" aria-label="Ganti tema">🌙</button>
  </header>
  <main class="shell-body">
    <div class="frame-wrap active" id="pane-lab">
      <div class="loading" id="loading-lab">
        <div class="spin"></div>INITIALIZING DATA MATRIX...
      </div>
      <iframe id="frame-lab" src="lab.html" title="Materi Sorting"></iframe>
    </div>
    <div class="frame-wrap" id="pane-sik">
      <div class="loading" id="loading-sik">
        <div class="spin"></div>LOADING CLASS DATA TERMINAL...
      </div>
      <iframe id="frame-sik" src="sik.html" title="Studi Kasus Sorting"></iframe>
    </div>
  </main>
  <script src="js/shell.js"></script>
</body>

</html>
